name: Auto Trigger Keep-Alive

on:
  schedule:
    # Offset by 3 min from main workflow — if main cron misses, this fires it
    - cron: '3,10,17,24,31,38,45,52,59 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    name: Trigger ping workflow
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Dispatch keep-alive workflow
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Dispatched at $(date -u '+%H:%M:%S UTC')"
