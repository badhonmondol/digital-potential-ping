name: Keep Server Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Digital Potential Server
    runs-on: ubuntu-latest

    steps:
      - name: Ping server
        run: |
          URL="https://digital-potential.onrender.com/"
          echo "Pinging $URL ..."

          STATUS=$(curl -sS -L \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /dev/null -w "%{http_code}" \
            "$URL" || true)

          echo "Response status: $STATUS"

          if [[ "$STATUS" =~ ^[0-9]{3}$ ]] && [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Server is awake!"
          else
            echo "⚠️ Server returned status $STATUS"
            exit 1
          fi
