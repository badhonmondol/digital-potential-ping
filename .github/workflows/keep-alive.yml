name: Keep Render Server Alive

on:
  schedule:
    - cron: '0,7,14,21,28,35,42,49,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    name: Ping Server
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wake up Render server
        continue-on-error: true
        run: |
          SERVER="https://digital-potential.onrender.com"

          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SERVER/api/health" || echo "000")
            echo "  attempt $i → $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server alive!"
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done

          for ep in /api/keep-alive /api/public-home; do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SERVER$ep" || echo "000")
            echo "  $ep → $S"
          done

          echo "✅ Done at $(date -u '+%H:%M:%S UTC')"

      - name: Keep scheduler alive (daily commit)
        if: github.event_name == 'schedule'
        run: |
          # Commit once per day at 00:00 UTC slot to prevent GitHub from
          # disabling the scheduled workflow due to repo inactivity.
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$HOUR" = "00" ] && [ "$MIN" -lt "10" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            echo "$(date -u)" > .last-ping
            git add .last-ping
            git commit -m "chore: keep scheduler alive [skip ci]"
            git push
            echo "✅ Daily commit pushed"
          fi
