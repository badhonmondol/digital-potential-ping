name: Keep Buy & Sell Server Alive (Backup)

# BACKUP layer — primary keep-alive is cron-job.org (external, reliable).
# This workflow fires on 6 staggered slots per hour. Even if GitHub drops
# some scheduled runs, at least one fires and its 9-min loop keeps the
# server awake. Any one firing slot per ~15 min is enough (Render sleeps at 15).

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Server (9 min loop)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ping server every 4.5 minutes
        run: |
          SERVER="https://digital-potential.onrender.com"

          echo "⏰ Ping loop started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          for i in 1 2; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$SERVER/api/health" || echo "000")
            echo "  [$(date -u '+%H:%M:%S')] ping $i/2 → /api/health: $STATUS"

            if [ "$STATUS" != "200" ]; then
              sleep 20
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$SERVER/api/health" || echo "000")
              echo "  [$(date -u '+%H:%M:%S')] retry $i → /api/health: $STATUS"
            fi

            [ "$i" -lt 2 ] && sleep 265
          done

          echo "✅ Ping loop completed at $(date -u '+%H:%M:%S UTC')"
