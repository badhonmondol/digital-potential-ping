name: Keep Render Server Alive

on:
  schedule:
    # Every 5 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

# Do NOT cancel in-progress runs — if two fire together, both should ping
concurrency:
  group: keep-alive-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Server
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wake up Render server
        continue-on-error: true
        run: |
          SERVER="https://digital-potential.onrender.com"

          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Primary health check — retry up to 5 times with 15s gaps
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$SERVER/api/health" || echo "000")
            echo "  attempt $i → $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server alive!"
              break
            fi
            [ $i -lt 5 ] && sleep 15
          done

          # Hit extra endpoints to reset Render's idle timer
          for ep in /api/keep-alive /api/public-home; do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SERVER$ep" || echo "000")
            echo "  $ep → $S"
          done

          echo "✅ Done at $(date -u '+%H:%M:%S UTC')"

      - name: Keep scheduler active (bump timestamp every run)
        if: github.event_name == 'schedule'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          date -u > .last-ping
          git add .last-ping
          git diff --cached --quiet || (git commit -m "chore: ping $(date -u '+%Y-%m-%d %H:%M') [skip ci]" && git push)
