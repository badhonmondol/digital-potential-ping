name: Keep Buy & Sell Server Alive

on:
  schedule:
    # Every 7 minutes — keeps Render free tier from sleeping (sleeps after 15 min idle)
    - cron: '0,7,14,21,28,35,42,49,56 * * * *'

  # Manual trigger
  workflow_dispatch:

jobs:
  ping:
    name: Ping Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake up server
        run: |
          SERVER="https://digital-potential.onrender.com"

          echo "⏰ Ping started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # --- /api/health (3 attempts, 30s timeout each) ---
          SUCCESS=false
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SERVER/api/health" || echo "000")
            echo "  /api/health attempt $i → Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              SUCCESS=true
              echo "✅ Server is alive!"
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "❌ Server did not respond after 3 attempts"
            exit 1
          fi

          # --- /api/keep-alive (single check) ---
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SERVER/api/keep-alive" || echo "000")
          echo "  /api/keep-alive → Status: $STATUS2"

          echo "✅ Ping completed at $(date -u '+%H:%M:%S UTC')"
